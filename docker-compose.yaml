services:
  catalogue:
    build:
      context: ./catalogue
      dockerfile: Dockerfile
    image: sandy056/catalogue:v1 
    # if we gave sandy056/catalogue it will directly push to docker hub
    container_name: catalogue
    depends_on:
    - mongodb
  mongodb:
    build: ./mongodb
    image: sandy056/mongodb:v1
    container_name: mongodb
  redis:
    image: redis:7.0
    container_name: redis
  mysql:
    build: ./mysql
    image: sandy056/mysql:v1
    container_name: mysql
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASSWORD: roboshop123
  user:
    build: ./user
    image: sandy056/user:v1
    container_name: user
    depends_on: 
    - mongodb
    - redis
  cart: 
    build: ./cart
    image: sandy056/cart:v1
    container_name: cart
    depends_on:
    - redis
    - catalogue
  shipping:
    build: ./shipping
    image: sandy056/shipping:v1
    container_name: shipping
    depends_on:
    - mysql
    - cart
  payment:
    build: ./payment
    image: sandy056/payment:v1
    container_name: payment
    depends_on:
    - cart
    - user
  frontend:
    build: ./frontend
    image: sandy056/frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment
networks:
  default: 
    driver: bridge
    name: robo-dock
    external: false




